<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLINT | 极简配文助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F9F9F9; }
        .glint-input { transition: all 0.3s ease; }
        .glint-input:focus { border-color: #1A1A1A; transform: translateY(-2px); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">
    
    <!-- 顶部 Logo -->
    <header class="mb-16 text-center">
        <h1 class="text-4xl font-light tracking-[0.2em] text-slate-900">GLINT</h1>
        <p class="text-xs text-slate-400 mt-2 tracking-widest">让文字泛起微光</p>
    </header>

    <!-- 输入区 -->
    <main class="w-full max-w-md">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <textarea id="keywords" rows="3" 
                class="glint-input w-full border-b border-gray-200 outline-none py-2 text-lg font-light placeholder-gray-300 resize-none" 
                placeholder="输入关键词（如：咖啡、雨天、心情）..."></textarea>
            
            <div class="flex justify-between mt-8 items-center">
                <select id="style" class="bg-transparent text-sm font-light text-slate-500 outline-none cursor-pointer">
                    <option value="chill">极简小清新</option>
                    <option value="luxury">凡尔赛高级感</option>
                    <option value="humor">幽默段子</option>
                    <option value="emo">深夜emo</option>
                </select>
                
                <button onclick="generate()" id="btn" class="px-8 py-2 bg-black text-white text-xs tracking-widest rounded-full hover:bg-slate-800 transition-all active:scale-95">
                    生成文案
                </button>
            </div>
        </div>

        <!-- 结果展示区（默认隐藏） -->
        <div id="result-container" class="hidden mt-8 p-6 bg-slate-50 rounded-xl border-l-2 border-slate-900">
            <p id="result-text" class="text-sm leading-relaxed text-slate-700 font-light"></p>
            <button onclick="copyText()" class="mt-4 text-[10px] uppercase tracking-tighter text-slate-400 hover:text-black">点击复制</button>
        </div>
    </main>

    <!-- 页脚：支付入口预览 -->
    <footer class="mt-20">
    <div class="flex flex-col items-center gap-2">
        <p class="text-[10px] text-slate-400 tracking-widest">能量已耗尽？</p>
        <button onclick="showPayment()" class="text-xs text-black border border-black px-6 py-2 rounded-full hover:bg-black hover:text-white transition duration-300">
            补充额度 ($0.99 / 20次)
        </button>
    </div>
</footer>

<div id="payment-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl">
        <h3 class="text-lg font-bold mb-2">获取更多能量</h3>
        <p class="text-sm text-slate-600 mb-6">
            支付 <span class="font-bold text-black">7 元</span><br>
            即可获得 20 次高级感文案生成额度
        </p>
        
        <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl py-12 mb-6">
            <p class="text-xs text-slate-400">请截图你的支付宝收款码<br>上传到 GitHub 后在此处展示</p>
            </div>

        <p class="text-[10px] text-slate-400 mb-6 italic">付款时请备注你的微信号或联系方式<br>作者将手动为你补给能量</p>
        
        <div class="flex flex-col gap-2">
            <button onclick="closePayment()" class="w-full py-3 bg-black text-white rounded-xl text-sm font-medium">已完成支付</button>
            <button onclick="closePayment()" class="text-slate-400 text-xs py-2">稍后再说</button>
        </div>
    </div>
</div>

   <script>
        async function generate() {
            const btn = document.getElementById('btn');
            const result = document.getElementById('result-container');
            const text = document.getElementById('result-text');
            const keywords = document.getElementById('keywords').value;
            const style = document.getElementById('style').value;

            if (!keywords) return alert("请输入关键词");

            btn.innerText = "正在泛起微光...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords, style })
                });
                
                const data = await response.json();
                result.classList.remove('hidden');
                text.innerText = data.text;
            } catch (error) {
                alert("能量暂时断开，请稍后再试");
                console.error(error);
            } finally {
                btn.innerText = "生成文案";
                btn.disabled = false;
            }
        }

        function copyText() {
            const text = document.getElementById('result-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("已复制到剪贴板");
            });
        }
       function showPayment() {
    document.getElementById('payment-modal').classList.remove('hidden');
}

function closePayment() {
    document.getElementById('payment-modal').classList.add('hidden');
}
    </script>
</body>
</html>
